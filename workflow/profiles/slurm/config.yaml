# Snakemake SLURM executor profile (snakemake-executor-plugin-slurm).
# Not run against a real cluster in this repo -- no SLURM allocation
# available in this environment -- but this is real, usable config-as-code:
# `snakemake -s workflow/Snakefile --workflow-profile workflow/profiles/slurm`
# on a machine with `sbatch` on PATH will submit each rule as its own job.
executor: slurm
jobs: 20
default-resources:
  slurm_partition: "compute"
  mem_mb: 4000
  runtime: 30
set-resources:
  star_index:
    mem_mb: 8000
    runtime: 20
  star_align:
    mem_mb: 6000
    runtime: 30
  feature_counts:
    mem_mb: 4000
    runtime: 15
  deseq2:
    mem_mb: 4000
    runtime: 10
  spark_aggregate:
    mem_mb: 4000
    runtime: 10
latency-wait: 30
rerun-incomplete: true
